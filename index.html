<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toolbox</title>
<meta name="description" content="Step-by-step home, yard, vehicle and recreation repairs with 3D walkthroughs and a Learn mode.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=JetBrains+Mono:wght@500&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="#" aria-label="Toolbox home">
    <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#3d2f05" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3.5 17.3a1.8 1.8 0 0 0 2.6 2.6l5.8-5.8a4 4 0 0 0 5.2-5.4l-2.5 2.5-2.3-.4-.4-2.3z"/></svg></span>
    Toolbox
  </a>
  <label class="search">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7" cy="7" r="4.8"/><path d="m10.6 10.6 3.4 3.4"/></svg>
    <input id="q" type="search" placeholder="Search repairs: leaky faucet, flat tire, campfire…" aria-label="Search repairs" autocomplete="off">
  </label>
  <button class="learn-toggle" id="learn" role="switch" aria-checked="false" title="Show the in-depth lessons">
    Learn mode <span class="learn-state">OFF</span><span class="switch" aria-hidden="true"></span>
  </button>
</header>
<main id="main"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="js/registry.js"></script>
<script src="js/viewer.js"></script>
<!-- content: one file per category -->
<script src="js/content/plumbing.js"></script>
<script src="js/content/electrical.js"></script>

<script src="js/content/appliances.js"></script>

<script src="js/content/floors.js"></script>
<script src="js/content/furniture.js"></script>
<script src="js/content/roof.js"></script>
<script src="js/content/deck.js"></script>
<script src="js/content/fence.js"></script>
<script src="js/content/concrete.js"></script>
<script src="js/content/lawn.js"></script>

<script src="js/content/basketball.js"></script>
<script src="js/content/grill.js"></script>
<script src="js/content/tech.js"></script>
<script src="js/app.js"></script>
</body>
</html>
