<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toolbox</title>
<meta name="description" content="Step-by-step home, yard, vehicle and recreation repairs with 3D walkthroughs and a Learn mode.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=JetBrains+Mono:wght@500&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#" aria-label="Toolbox home">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3.5 17.3a1.8 1.8 0 0 0 2.6 2.6l5.8-5.8a4 4 0 0 0 5.2-5.4l-2.5 2.5-2.3-.4-.4-2.3z"/></svg></span>
      <span>Toolbox</span>
    </a>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input id="q" type="search" placeholder="Search repairs and builds" aria-label="Search repairs" autocomplete="off">
    </label>
    <button class="learn-toggle" id="learn" role="switch" aria-checked="false" title="Show the in-depth lessons">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
      <span>Learn mode</span> <span class="learn-state">Off</span><span class="switch" aria-hidden="true"></span>
    </button>
  </div>
  <nav class="domnav" id="domnav" aria-label="Sections"></nav>
</header>
<main id="main"></main>
<footer class="foot">
  <div class="foot-in">
    <div><b class="foot-brand">Toolbox</b><p>Step-by-step repairs and builds with 3D walkthroughs. Guides are general information. Follow local codes and your manufacturer’s instructions, and call a licensed pro when a guide says so.</p></div>
    <div><b>3D assets</b><p>Photo-scanned models, textures and lighting from Poly Haven (CC0). <a href="#credits">See credits</a>.</p></div>
  </div>
</footer>
